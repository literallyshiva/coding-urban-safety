name: Update changelog after merge

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: changelog-main
  cancel-in-progress: false

jobs:
  update-changelog:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Record merged pull request
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            const path = 'CHANGELOG.md';
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = pr.title.replace(/\s+/g, ' ').trim();
            const date = (pr.merged_at || new Date().toISOString()).slice(0, 10);
            const marker = `<!-- merged-pr:${pr.number} -->`;
            const cleanBody = (pr.body || 'No description provided.')
              .replace(/<!--[^]*?-->/g, '')
              .trim()
              .slice(0, 2000);
            const quote = cleanBody.split('\n').map(line => `> ${line}`).join('\n');
            const entry = `\n### ${date} — PR #${pr.number}: ${title}\n\n${marker}\nMerged by ${pr.merged_by?.login || 'unknown'} · [View pull request](${pr.html_url})\n\n${quote}\n`;
            for (let attempt = 0; attempt < 5; attempt++) {
              let sha;
              let current;
              try {
                const response = await github.rest.repos.getContent({ owner, repo, path, ref: 'main' });
                sha = response.data.sha;
                current = Buffer.from(response.data.content, 'base64').toString('utf8');
              } catch (error) {
                if (error.status !== 404) throw error;
                current = '# Changelog\n\nMerged changes to Coding Urban Safety.\n';
              }
              if (current.includes(marker)) {
                core.info(`PR #${pr.number} already recorded`);
                return;
              }
              const updated = current.trimEnd() + '\n' + entry;
              try {
                await github.rest.repos.createOrUpdateFileContents({
                  owner, repo, path,
                  message: `docs: record merged PR #${pr.number} [skip ci]`,
                  content: Buffer.from(updated, 'utf8').toString('base64'),
                  branch: 'main',
                  ...(sha ? { sha } : {}),
                });
                core.info(`Recorded PR #${pr.number} in CHANGELOG.md`);
                return;
              } catch (error) {
                if (error.status !== 409 && error.status !== 422 || attempt === 4) throw error;
              }
            }
