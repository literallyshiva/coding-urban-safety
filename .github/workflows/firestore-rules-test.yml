
name: Firestore Security Rules Tests

on:
  workflow_dispatch:

jobs:
  test-firestore-rules:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install test dependencies
        run: |
          npm install --no-save firebase@12 @firebase/rules-unit-testing@5 firebase-tools@14

      - name: Run Firestore emulator tests
        run: |
          npx firebase emulators:exec \
            --project demo-urban-safety-tests \
            --config firebase/firebase.json \
            --only firestore \
            "node firebase/tests/firestore.rules.test.cjs"
